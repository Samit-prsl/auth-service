services:
  postgres :
    image: postgres:16
    container_name: auth-db-medhelp
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
        - postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: medhelp_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - 5050:80
    depends_on:
      - postgres

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medhelp
    ports:
      - 3333:3000
    depends_on:
      - postgres
    env_file:
      - .env

volumes:
  postgres-data:
    